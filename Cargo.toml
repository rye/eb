[package]
name = "eb"
description = "A command executor exercising exponential backoff"
edition = "2021"
version = "0.6.0"
rust-version = "1.88"
authors = ["Kristofer Rye <kristofer.rye@gmail.com>"]
license = "GPL-3.0-only"

repository = "https://github.com/rye/eb"
readme = "README.md"
keywords = ["cli", "exponential", "backoff", "tool"]
categories = ["command-line-utilities"]

[badges]
is-it-maintained-issue-resolution = { repository = "rye/eb" }
is-it-maintained-open-issues = { repository = "rye/eb" }
maintenance = { status = "actively-developed" }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow", "dep:thiserror", "dep:log"]
simple_logger = ["dep:simple_logger", "cli"]
tokio = ["dep:tokio"]

[dependencies]
anyhow = { version = "1", optional = true }
clap = { optional = true, version = "4.6.7", default-features = false, features = ["std", "suggestions", "color", "help", "usage", "error-context"] }
simple_logger = { version = "5", optional = true }
log = { version = "0.4.20", optional = true }
rand = "0.10.0"
thiserror = { version = "2", optional = true }
tokio = { version = "1.0.1", optional = true, default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1.0.1", default-features = false, features = ["rt", "time"] }
assert_cmd = "2.1.1"
predicates = { version = "3.1.3", default-features = false }
tempfile = "3.23.0"

[[bin]]
name = "eb"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]
